# The triple-colon fence vocabulary this vault's renderer recognises.
#
# The standard it encodes is the vault's fence conventions document (standards/markdown-fence-conventions.md, or
# memory/designs/markdown-extension.md in a scaffolded vault). Edit this file to change what the renderer recognises:
# a fence not listed here renders plainly, flagged as unknown.
#
# schema: the format of this file. A renderer that does not support it uses its built-in vocabulary instead.
# role: callout (a titled container), layout (a layout container), status (a labelled banner), or page (a page break).
# tone: neutral, positive, caution, critical, emphasis, or analysis. The theme decides the colours.
# self_closing: the fence needs no closing line.
# alias_of: the fence is another name for the fence it names.

schema = 1
standard = "markdown-fence-conventions 2026-10"

