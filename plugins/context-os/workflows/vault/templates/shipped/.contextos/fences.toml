self_closing = true

# Attributes, written {key=value key="quoted value" flag}. type: text, id (letters, digits, - and _), token (a word),
# integer, or boolean. values limits a token to the listed words.

[attributes.title]
type = "text"

[attributes.id]
type = "id"

[attributes.variant]
type = "token"

[attributes.cols]
type = "integer"

[attributes.gap]
type = "token"

[attributes.collapse]
type = "boolean"

[attributes.open]
type = "boolean"

[attributes.level]
type = "token"

[attributes.display]
type = "token"
values = ["block", "inline"]
